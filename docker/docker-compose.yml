# Containerized heavy/JVM path: the bridge build and (later) the upstream mage build + XMage server.
# Android :app builds run on the host. Driven via ../scripts/dev. See ../docs/build-environment.md.
#
# Relative paths resolve from this file's directory (docker/), so `..` is the repo root.
services:
  build:
    build:
      context: .
      dockerfile: jvm/Dockerfile
      # BuildKit's default provenance/SBOM attestations embed a build timestamp, so the image gets
      # a new ID on every rebuild even when every layer is a cache hit — that new ID then busts
      # xmage-server's and bridge's `FROM mage-free-client/build:latest` cache downstream, forcing
      # their multi-minute upstream-mage clone+install to redo for no real reason. These fields
      # alone did not fix it (confirmed by rebuilding twice and diffing image IDs) — the
      # BUILDX_NO_DEFAULT_ATTESTATIONS=1 env var scripts/dev sets is what actually disables them;
      # kept here too as documentation/best-effort for anyone invoking `docker compose` directly.
      provenance: false
      sbom: false
    image: mage-free-client/build:latest
    environment:
      # No Android SDK in this image — skip Android modules so :bridge configures/builds cleanly.
      MAGE_JVM_ONLY: "1"
    volumes:
      - ..:/workspace
      - gradle-cache:/root/.gradle
      # No /root/.m2 volume: mage-common is baked into the image there, and a volume
      # mount would shadow it. Gradle's own deps cache in gradle-cache.
    working_dir: /workspace

  # Reference XMage server: Mage.Server on 17171 with auth disabled. The build
  # service reaches it at xmage-server:17171; bridge integration tests use XMAGE_SERVER for it.
  xmage-server:
    build:
      context: .
      dockerfile: server/Dockerfile
    image: mage-free-client/xmage-server:latest
    depends_on:
      - build
    ports:
      - "17171:17171"
    # Startup loads the card database (~1–2 min); readiness is a TCP connect to 17171.

  # The bridge itself, running. The reference server above proves the *bridge's* half of
  # the protocol; this service is what lets the **app's** half — `:core:network`'s KtorBridgeClient —
  # be driven against something real. Its `/v1/session` WebSocket is published on the host at
  # ws://localhost:8080, which is what BRIDGE_URL points at for the app-side live tests (they run on
  # the host, since :core:network is an Android module and this image has no Android SDK).
  bridge:
    build:
      # Repo root: the image assembles :bridge from source (see bridge/Dockerfile's COPYs).
      context: ..
      dockerfile: docker/bridge/Dockerfile
    image: mage-free-client/bridge:latest
    depends_on:
      - build
      - xmage-server
    environment:
      # Pinned-server posture (architecture.md decision #6): the app never names an XMage host — the
      # bridge reads its own upstream from here (UpstreamTarget.fromEnv), over the compose network.
      XMAGE_UPSTREAM: "xmage-server:17171"
      # Read by application.conf (`port = ${?BRIDGE_PORT}`); stated rather than implied.
      BRIDGE_PORT: "8080"
    ports:
      - "8080:8080"
    # `depends_on` waits for the container to start, not for the server to finish loading its card
    # database — a login issued in that window fails upstream. The bridge itself is up immediately;
    # give the server its ~1–2 min before running the live suite.

volumes:
  gradle-cache:
