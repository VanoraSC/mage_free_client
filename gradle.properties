# Project-wide Gradle settings.

# Give the Gradle daemon enough heap/metaspace for the Android + KSP toolchain.
org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8

# Use AndroidX (required by the :app module's Jetpack/Compose dependencies).
android.useAndroidX=true
# Generate per-module R classes without transitive resources (smaller, faster builds).
android.nonTransitiveRClass=true
