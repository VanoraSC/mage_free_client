[versions]
kotlin = "2.4.10"
ktor = "3.5.1"
kotlinx-serialization = "1.11.0"
kotlinx-coroutines = "1.10.2"
logback = "1.5.38"
junit = "5.14.4"
junit-platform = "1.14.4"
ktlint = "13.1.0"

# XMage client session library (bridge-only; resolved from mavenLocal, baked into the build image).
# Pulls org.mage:mage transitively. Must NEVER reach an Android module.
mage = "1.4.60"

# Android / Compose / DI
agp = "8.13.2"
ksp = "2.3.10"
# Koin rather than Hilt: Hilt is Dagger-based, Android-component-generating, and has no multiplatform
# story — the one genuine blocker to a second target. 4.1.0 is the current
# stable across koin-core / koin-android / koin-androidx-compose, resolved and built against the
# pinned Kotlin 2.4.10 and Compose BOM 2025.09.01. Coordinates come from the BOM below; only this
# version is pinned.
koin = "4.1.0"
androidx-core-ktx = "1.16.0"
androidx-activity-compose = "1.10.1"
androidx-lifecycle = "2.9.3"
compose-bom = "2025.09.01"
junit4 = "4.13.2"
androidx-test-ext-junit = "1.3.0"
androidx-espresso = "3.7.0"
androidx-navigation = "2.9.8"
androidx-concurrent-futures = "1.2.0"
androidx-datastore = "1.1.7"
turbine = "1.2.0"
# JVM-side Android SQLite for :core:cards catalog tests (no device needed).
robolectric = "4.14.1"
# Compose-native image pipeline (memory+disk cache, de-dup) backing the card-art loader.
coil = "3.1.0"
# The OkHttp generation `coil-network-okhttp` brings in transitively — pinned explicitly
# so the test-only MockWebServer matches the client under test exactly.
okhttp = "4.12.0"
# okio backs the multiplatform bundled-asset boundary. Already on the classpath via Coil and DataStore
# at this version; declared explicitly because :core:cards uses it directly.
okio = "3.10.2"
# On-device deck library persistence (queryable relational store, Robolectric-testable).
room = "2.7.1"
# The multiplatform SQLite driver API behind the bundled card catalog. 2.5.0 is the version Room 2.7.1
# already resolves, so this pins what is on the classpath rather than adding one.
androidx-sqlite = "2.5.0"

[libraries]
ktor-server-core = { module = "io.ktor:ktor-server-core", version.ref = "ktor" }
ktor-server-netty = { module = "io.ktor:ktor-server-netty", version.ref = "ktor" }
ktor-server-content-negotiation = { module = "io.ktor:ktor-server-content-negotiation", version.ref = "ktor" }
ktor-serialization-kotlinx-json = { module = "io.ktor:ktor-serialization-kotlinx-json", version.ref = "ktor" }
ktor-server-call-logging = { module = "io.ktor:ktor-server-call-logging", version.ref = "ktor" }
ktor-server-websockets = { module = "io.ktor:ktor-server-websockets", version.ref = "ktor" }
ktor-server-test-host = { module = "io.ktor:ktor-server-test-host", version.ref = "ktor" }
ktor-client-core = { module = "io.ktor:ktor-client-core", version.ref = "ktor" }
ktor-client-okhttp = { module = "io.ktor:ktor-client-okhttp", version.ref = "ktor" }
# Ktor's own engine, used by the card-art client. Pure Kotlin and multiplatform, so
# :core:cards carries no engine that would have to be swapped for a second target.
ktor-client-cio = { module = "io.ktor:ktor-client-cio", version.ref = "ktor" }
ktor-client-mock = { module = "io.ktor:ktor-client-mock", version.ref = "ktor" }
ktor-client-websockets = { module = "io.ktor:ktor-client-websockets", version.ref = "ktor" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinx-serialization" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinx-coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "kotlinx-coroutines" }
logback-classic = { module = "ch.qos.logback:logback-classic", version.ref = "logback" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter", version.ref = "junit" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher", version.ref = "junit-platform" }

# XMage client session library — :bridge only (see [versions].mage).
mage-common = { module = "org.mage:mage-common", version.ref = "mage" }

# Android / Compose / DI
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "androidx-core-ktx" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "androidx-activity-compose" }
androidx-lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "androidx-lifecycle" }
androidx-lifecycle-runtime-ktx = { module = "androidx.lifecycle:lifecycle-runtime-ktx", version.ref = "androidx-lifecycle" }
# ProcessLifecycleOwner for the whole-app foreground/background reconnect hook.
androidx-lifecycle-process = { module = "androidx.lifecycle:lifecycle-process", version.ref = "androidx-lifecycle" }
androidx-lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "androidx-lifecycle" }
compose-bom = { module = "androidx.compose:compose-bom", version.ref = "compose-bom" }
compose-ui = { module = "androidx.compose.ui:ui" }
compose-ui-graphics = { module = "androidx.compose.ui:ui-graphics" }
compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
compose-ui-test-junit4 = { module = "androidx.compose.ui:ui-test-junit4" }
compose-ui-test-manifest = { module = "androidx.compose.ui:ui-test-manifest" }
compose-material3 = { module = "androidx.compose.material3:material3" }
compose-material3-window-sizeclass = { module = "androidx.compose.material3:material3-window-size-class" }
compose-material-icons-core = { module = "androidx.compose.material:material-icons-core" }

# The board animation host (0098) drives placement animations itself: it measures where an object
# was and where it now is, and runs an `Animatable` between the two. That type and its specs live in
# `animation-core`, which is what the host actually uses — the fuller `animation` artifact adds the
# `AnimatedVisibility`/`AnimatedContent` surfaces the host has no need of. Version from the BOM.
compose-animation-core = { module = "androidx.compose.animation:animation-core" }

androidx-navigation-compose = { module = "androidx.navigation:navigation-compose", version.ref = "androidx-navigation" }
androidx-navigation-testing = { module = "androidx.navigation:navigation-testing", version.ref = "androidx-navigation" }

# Koin. BOM-managed like Compose, so the artifacts carry no per-lib version.
# - `koin-core`      the graph itself; multiplatform, and the only one a `:core:*` module needs.
# - `koin-android`   `androidContext()` + the Android `viewModel { }` binding; Android modules only.
# - `koin-compose`   `koinViewModel()` / `koinInject()` inside Composables.
# - `koin-test`      `verify()`, the module-graph check that buys back Hilt's compile-time safety.
koin-bom = { module = "io.insert-koin:koin-bom", version.ref = "koin" }
koin-core = { module = "io.insert-koin:koin-core" }
koin-android = { module = "io.insert-koin:koin-android" }
koin-compose = { module = "io.insert-koin:koin-androidx-compose" }
koin-test = { module = "io.insert-koin:koin-test" }
junit4 = { module = "junit:junit", version.ref = "junit4" }
androidx-test-ext-junit = { module = "androidx.test.ext:junit", version.ref = "androidx-test-ext-junit" }
androidx-espresso-core = { module = "androidx.test.espresso:espresso-core", version.ref = "androidx-espresso" }
androidx-concurrent-futures = { module = "androidx.concurrent:concurrent-futures", version.ref = "androidx-concurrent-futures" }
androidx-sqlite = { module = "androidx.sqlite:sqlite", version.ref = "androidx-sqlite" }
androidx-sqlite-framework = { module = "androidx.sqlite:sqlite-framework", version.ref = "androidx-sqlite" }
# SQLite for the jvm() target. `sqlite-framework` wraps the *platform's* SQLite, which a
# JVM host does not have — `sqlite-bundled` carries its own native library, so the JVM tests open the
# same databases the Android target does without the host providing anything.
androidx-sqlite-bundled = { module = "androidx.sqlite:sqlite-bundled", version.ref = "androidx-sqlite" }
androidx-datastore-preferences = { module = "androidx.datastore:datastore-preferences", version.ref = "androidx-datastore" }

# Gradle plugin artifacts — consumed by the build-logic convention plugins (compileOnly)
android-gradle-plugin = { module = "com.android.tools.build:gradle", version.ref = "agp" }
kotlin-gradle-plugin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }
turbine = { module = "app.cash.turbine:turbine", version.ref = "turbine" }
robolectric = { module = "org.robolectric:robolectric", version.ref = "robolectric" }

# Card-artwork loader/cache. `coil-core` = the ImageLoader (memory+disk cache, request
# de-dup); `coil-network-okhttp` = the HTTP fetcher that resolves the URL from XMageImageSource and
# writes bytes to the disk cache. `coil-compose` (the AsyncImage surface) is pinned here for the
# card-inspection UI to consume; :core:cards itself is not a Compose module and only wires the loader.
coil-core = { module = "io.coil-kt.coil3:coil", version.ref = "coil" }
coil-compose = { module = "io.coil-kt.coil3:coil-compose", version.ref = "coil" }
coil-network-okhttp = { module = "io.coil-kt.coil3:coil-network-okhttp", version.ref = "coil" }
# The multiplatform network fetcher. Same pinned Coil 3.1.0 — the engine becomes a
# platform choice (OkHttp on Android) instead of the fetcher itself being OkHttp-shaped.
okio = { module = "com.squareup.okio:okio", version.ref = "okio" }
coil-network-ktor3 = { module = "io.coil-kt.coil3:coil-network-ktor3", version.ref = "coil" }

# Test-only HTTP server used to inspect the *actual* outgoing art request (its headers),
# rather than trusting that the loader was configured correctly. Pinned to the same OkHttp version
# `coil-network-okhttp:3.1.0` resolves (`com.squareup.okhttp3:okhttp:4.12.0`), so the mock server and
# the client under test are the same generation.
okhttp-mockwebserver = { module = "com.squareup.okhttp3:mockwebserver", version.ref = "okhttp" }

# Room-backed offline deck library. `room-runtime` is Room's multiplatform artifact — it resolves to
# `room-runtime-android` for the Android target and `room-runtime-jvm` for the JVM one, and carries the
# coroutines/Flow query support `room-ktx` used to provide. The compiler runs through KSP, which
# :core:decks applies explicitly (there is no Hilt plugin to bring it in), and per target
# (`kspAndroid`/`kspJvm`).
room-runtime = { module = "androidx.room:room-runtime", version.ref = "room" }
room-compiler = { module = "androidx.room:room-compiler", version.ref = "room" }

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
# The multiplatform plugin behind `magefree.kmp.library`. Same pinned Kotlin
# version as every other Kotlin plugin here — KMP is a plugin choice, not a version bump.
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
ktlint = { id = "org.jlleitschuh.gradle.ktlint", version.ref = "ktlint" }
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
